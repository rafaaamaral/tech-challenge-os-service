name: OS Service - CI/CD

# PR para main: build, testes e SonarCloud.
# Push na main: build, testes, SonarCloud, smoke do artefato, imagem no GHCR e deploy no Kubernetes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Em PRs execuções antigas são canceladas; na main nunca (evita interromper um deploy em andamento).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: Release
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  API_PROJECT: src/TechChallenge.OS.Api/TechChallenge.OS.Api.csproj
  TEST_PROJECT: src/TechChallenge.OS.UnitTests/TechChallenge.OS.UnitTests.csproj

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 01 - Restore e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependências
        run: dotnet restore TechChallenge.OS.slnx

      - name: Compilar solução em Release
        run: dotnet build TechChallenge.OS.slnx -c "$BUILD_CONFIGURATION" --no-restore --warnaserror -warnNotAsError:CS1591

  tests:
    name: 02 - ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: Testes unitários
            filter: FullyQualifiedName!~.Integration.&FullyQualifiedName!~.Api.Authentication.
            postgres_image: ''
          - suite: integration
            name: Testes de integração HTTP/JWT e PostgreSQL
            filter: FullyQualifiedName~.Integration.|FullyQualifiedName~.Api.Authentication.
            postgres_image: postgres:16
    env:
      TEST_FILTER: ${{ matrix.filter }}
      TEST_SUITE: ${{ matrix.suite }}
      RUN_POSTGRES_INTEGRATION_TESTS: ${{ matrix.suite == 'integration' && 'true' || 'false' }}
      OSDB_INTEGRATION_TEST_CONNECTION: Host=127.0.0.1;Port=5433;Database=techchallenge_os_test;Username=postgres;Password=postgres
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: techchallenge_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d techchallenge_os_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Executar suíte e coletar cobertura
        run: >-
          dotnet test "$TEST_PROJECT" -c "$BUILD_CONFIGURATION"
          --filter "$TEST_FILTER"
          --logger "trx;LogFileName=$TEST_SUITE.trx"
          --results-directory "artifacts/test-results/$TEST_SUITE"
          --collect "XPlat Code Coverage" --settings tests/coverage.runsettings

      - name: Validar execução dos testes e gerar resumo
        if: always()
        shell: powershell
        run: ./scripts/Write-TestSummary.ps1 -ResultsDirectory "artifacts/test-results/$env:TEST_SUITE" -Suite $env:TEST_SUITE

      - name: Disponibilizar relatórios TRX e cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.suite }}
          path: artifacts/test-results/${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: 03 - SonarCloud
    needs: tests
    # Secrets não são entregues a PRs de forks nem ao Dependabot: nesses casos o job é pulado.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_POSTGRES_INTEGRATION_TESTS: 'true'
      OSDB_INTEGRATION_TEST_CONNECTION: Host=127.0.0.1;Port=5433;Database=techchallenge_os_test;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: techchallenge_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d techchallenge_os_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Validar configuração do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          missing=0
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Secret SONAR_TOKEN não configurado (Settings > Secrets and variables > Actions > Secrets)."
            missing=1
          fi
          if [[ -z "$SONAR_PROJECT_KEY" ]]; then
            echo "::error::Variable SONAR_PROJECT_KEY não configurada (Settings > Secrets and variables > Actions > Variables)."
            missing=1
          fi
          if [[ -z "$SONAR_ORGANIZATION" ]]; then
            echo "::error::Variable SONAR_ORGANIZATION não configurada (Settings > Secrets and variables > Actions > Variables)."
            missing=1
          fi
          exit "$missing"

      - name: Obter código e histórico Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --tool-path "$RUNNER_TEMP/sonar-tools" --version 12.1.0 --allow-roll-forward

      - name: Iniciar análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
        run: |
          # SONAR_REGION é opcional: defina "us" apenas para organizações SonarQube Cloud na região dos EUA.
          if [[ "$SONAR_REGION" == "us" ]]; then
            destination=("/d:sonar.region=us")
          else
            destination=("/d:sonar.host.url=https://sonarcloud.io")
          fi
          "$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" begin \
            "/k:$SONAR_PROJECT_KEY" "/o:$SONAR_ORGANIZATION" "${destination[@]}" "/d:sonar.token=$SONAR_TOKEN" \
            '/d:sonar.cs.opencover.reportsPaths=artifacts/sonar-results/**/coverage.opencover.xml' \
            '/d:sonar.cs.vstest.reportsPaths=artifacts/sonar-results/**/*.trx' \
            '/d:sonar.exclusions=**/Migrations/**' \
            /d:sonar.scanner.scanAll=false /d:sonar.qualitygate.wait=true

      - name: Compilar para análise
        run: dotnet build TechChallenge.OS.slnx -c "$BUILD_CONFIGURATION" --no-incremental

      - name: Executar todos os testes com cobertura OpenCover
        run: >-
          dotnet test "$TEST_PROJECT" -c "$BUILD_CONFIGURATION" --no-build
          --logger "trx;LogFileName=sonar.trx"
          --results-directory artifacts/sonar-results
          --collect "XPlat Code Coverage" --settings tests/coverage.runsettings

      - name: Publicar análise e aguardar Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" end "/d:sonar.token=$SONAR_TOKEN"'

  package:
    name: 04 - Publicar e validar artefato de entrega
    needs: [build, tests, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5080
      ConnectionStrings__OSDb: Host=127.0.0.1;Port=5432;Database=techchallenge_os_smoke;Username=postgres;Password=postgres
      Jwt__Issuer: os-ci-smoke
      Jwt__Audience: os-ci-smoke
      Jwt__SigningKey: os-ci-smoke-local-signing-key-with-32-bytes
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_HOST: '127.0.0.1'
      RABBITMQ_USER: os-ci
      RABBITMQ_PASSWORD: os-ci-local
      RABBITMQ_QUEUE: os-service.events
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: techchallenge_os_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d techchallenge_os_smoke"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
      rabbitmq:
        image: rabbitmq:4.2.9-management
        env:
          RABBITMQ_DEFAULT_USER: os-ci
          RABBITMQ_DEFAULT_PASS: os-ci-local
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publicar aplicação em Release
        run: >-
          dotnet publish "$API_PROJECT" -c "$BUILD_CONFIGURATION"
          --self-contained false -p:UseAppHost=false --output artifacts/publish

      - name: Gerar e aplicar migrations no PostgreSQL efêmero
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          dotnet tool install dotnet-ef --version 10.0.14 --tool-path "$RUNNER_TEMP/os-tools"
          "$RUNNER_TEMP/os-tools/dotnet-ef" migrations script --idempotent --no-build \
            --configuration "$BUILD_CONFIGURATION" --project src/TechChallenge.OS.Infrastructure \
            --startup-project "$API_PROJECT" --output artifacts/publish/migrations.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d techchallenge_os_smoke < artifacts/publish/migrations.sql

      - name: Validar health e consumo no RabbitMQ da aplicação publicada
        env:
          RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          dotnet artifacts/publish/TechChallenge.OS.Api.dll > artifacts/smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:5080/health > artifacts/health.txt &&
              grep -qx Healthy artifacts/health.txt &&
              docker exec "$RABBITMQ_CONTAINER_ID" rabbitmqctl -q list_queues --no-table-headers name consumers > artifacts/rabbitmq-queues.txt &&
              awk -v queue="$RABBITMQ_QUEUE" '$1 == queue && $2 > 0 { found = 1 } END { exit !found }' artifacts/rabbitmq-queues.txt; then
              echo 'Aplicação publicada respondeu Healthy e registrou o consumidor no RabbitMQ.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat artifacts/smoke.log
          exit 1

      - name: Empacotar aplicação e gerar checksum SHA256
        working-directory: artifacts
        run: |
          tar -czf os-service-main.tar.gz -C publish .
          sha256sum os-service-main.tar.gz > os-service-main.tar.gz.sha256

      - name: Disponibilizar pacote de entrega
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-service-main-${{ github.sha }}
          path: |
            artifacts/os-service-main.tar.gz
            artifacts/os-service-main.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Disponibilizar diagnóstico da inicialização
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-service-smoke
          path: |
            artifacts/smoke.log
            artifacts/health.txt
            artifacts/rabbitmq-queues.txt
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: 05 - Docker build e push (GHCR)
    needs: [build, tests, sonar, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Definir nome da imagem (ghcr.io/<owner>/<repo>:<commit-sha>)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Autenticar no GHCR com GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Construir imagem
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: >-
          docker build
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --tag "$IMAGE" .

      - name: Publicar imagem
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker push "$IMAGE"
          echo "Imagem publicada: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 06 - Deploy Kubernetes
    needs: [build, tests, sonar, package, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runner self-hosted Windows (GMODE-21) com kubectl e o contexto docker-desktop do usuário do runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    env:
      K8S_NAMESPACE: tech-challenge
      K8S_CONTEXT: docker-desktop
      IMAGE: ${{ needs.docker.outputs.image }}
    steps:
      - name: Obter manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar contexto docker-desktop
        run: |
          $ErrorActionPreference = 'Stop'
          kubectl config use-context $env:K8S_CONTEXT
          if ($LASTEXITCODE -ne 0) { throw "Contexto $env:K8S_CONTEXT não encontrado no kubeconfig do usuário do runner." }
          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) { throw "Cluster docker-desktop inacessível. Habilite o Kubernetes no Docker Desktop." }

      - name: Aplicar namespace, ConfigMap e Service
        run: |
          $ErrorActionPreference = 'Stop'
          kubectl --context $env:K8S_CONTEXT apply -f k8s/namespace.yaml -f k8s/configmap.yaml -f k8s/service.yaml
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar namespace/ConfigMap/Service.' }

      - name: Verificar Secret da aplicação
        run: |
          kubectl --context $env:K8S_CONTEXT get secret os-service-secrets -n $env:K8S_NAMESPACE | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Secret os-service-secrets não existe no namespace $env:K8S_NAMESPACE. Crie-o conforme o README (k8s/secret.example.yaml é apenas um modelo e não é aplicado)."
            exit 1
          }

      - name: Aplicar Deployment com a imagem publicada
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Imagem do deploy: $env:IMAGE"
          $manifest = (Get-Content k8s/deployment.yaml -Raw).Replace('__OS_IMAGE__', $env:IMAGE)
          if ($manifest.Contains('__OS_IMAGE__')) { throw 'Placeholder da imagem não substituído.' }
          $manifest | kubectl --context $env:K8S_CONTEXT apply -f -
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao aplicar o Deployment.' }

      - name: Aguardar rollout
        run: |
          kubectl --context $env:K8S_CONTEXT rollout status deployment/os-service -n $env:K8S_NAMESPACE --timeout=300s
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Confirmar imagem em execução
        run: |
          $running = kubectl --context $env:K8S_CONTEXT get deployment os-service -n $env:K8S_NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].image}'
          Write-Host "Imagem no Deployment: $running"
          if ($running -ne $env:IMAGE) { throw "Imagem divergente: esperado $env:IMAGE" }

      - name: Diagnóstico (logs e eventos)
        if: failure()
        run: |
          $ctx = $env:K8S_CONTEXT; $ns = $env:K8S_NAMESPACE
          kubectl --context $ctx get deployment,replicaset,pods,svc -n $ns -o wide
          kubectl --context $ctx describe deployment os-service -n $ns
          kubectl --context $ctx describe pods -n $ns -l app.kubernetes.io/name=os-service
          kubectl --context $ctx get events -n $ns --sort-by=.lastTimestamp
          kubectl --context $ctx logs -n $ns -l app.kubernetes.io/name=os-service --tail=100 --all-containers
          exit 0
