services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  postgres-os:
    image: postgres:16
    environment:
      POSTGRES_DB: techchallenge_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techchallenge_os"]
      interval: 3s
      timeout: 5s
      retries: 15

  os-api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-os:
        condition: service_healthy
    environment:
      OSDB_CONNECTION_STRING: Host=postgres-os;Port=5432;Database=techchallenge_os;Username=postgres;Password=postgres
      Jwt__Issuer: ${JWT_ISSUER:-changeme}
      Jwt__Audience: ${JWT_AUDIENCE:-changeme}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-changeme-changeme-changeme-changeme}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: os-service.events
