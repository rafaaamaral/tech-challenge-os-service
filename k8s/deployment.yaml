apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/part-of: tech-challenge
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: os-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: os-service
        app.kubernetes.io/part-of: tech-challenge
    spec:
      # Necessário apenas se a imagem no GHCR for privada (ver README).
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654 # usuário "app" das imagens aspnet:10.0
        runAsGroup: 1654
      containers:
        - name: os-service
          # O workflow substitui __OS_IMAGE__ por ghcr.io/<owner>/<repo>:<commit-sha> antes do apply.
          image: __OS_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: os-service-config
          env:
            - name: ConnectionStrings__OSDb
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: ConnectionStrings__OSDb
            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: Jwt__Audience
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: Jwt__SigningKey
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: RABBITMQ_PASSWORD
          # /health verifica o PostgreSQL: usado na readiness para tirar o pod do Service
          # quando o banco estiver indisponível.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness sem dependência externa: uma queda do banco não deve reiniciar o pod.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
