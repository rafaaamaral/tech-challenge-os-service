# OPCIONAL: PostgreSQL exclusivo do OS Service (database per service) para clusters locais/acadêmicos.
# Não é aplicado pelo workflow. Dispense este arquivo se já houver um PostgreSQL acessível.
# Pré-requisito: Secret "os-postgres-secret" com POSTGRES_DB, POSTGRES_USER e POSTGRES_PASSWORD
# (ver k8s/optional/postgres-os-secret.example.yaml).
apiVersion: v1
kind: Service
metadata:
  name: postgres-os
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: postgres-os
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-os
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-os
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: postgres-os
spec:
  serviceName: postgres-os
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-os
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: os-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
