# MODELO. NÃO contém credenciais reais e NÃO é aplicado pelo workflow.
# Crie o Secret real no cluster (ver README, seção "Kubernetes"), por exemplo:
#   kubectl create secret generic os-service-secrets -n tech-challenge --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: os-service-secrets
  namespace: tech-challenge
type: Opaque
stringData:
  ConnectionStrings__OSDb: "Host=postgres-os;Port=5432;Database=techchallenge_os;Username=<usuario>;Password=<senha>"
  Jwt__Issuer: "<issuer-do-servico-de-autenticacao>"
  Jwt__Audience: "<audience>"
  Jwt__SigningKey: "<chave-hs256-com-pelo-menos-32-bytes>"
  RABBITMQ_USER: "<usuario-rabbitmq>"
  RABBITMQ_PASSWORD: "<senha-rabbitmq>"
